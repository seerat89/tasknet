<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 980 450" role="img" aria-labelledby="arch-title arch-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <title id="arch-title">TaskNet architecture</title>
    <desc id="arch-desc">The browser, through the Laravel UI, and an AI client, through OAuth and the MCP server, both reach the same shared Laravel layer of actions, policies, validation and limits, which reads and writes PostgreSQL. The shared layer also emits events that Reverb and Redis deliver to the browser, which refreshes automatically.</desc>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#78716c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
        <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
    </defs>

    <!-- Lane 1: browser -->
    <rect x="0" y="64" width="120" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="60" y="90" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">Browser</text>
    <rect x="160" y="64" width="260" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="290" y="90" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">Laravel UI</text>
    <path d="M120 90H158" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M420 90H466" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow-teal)" />

    <!-- Lane 2: AI client -->
    <rect x="0" y="224" width="120" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="60" y="250" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">AI client</text>
    <rect x="160" y="224" width="100" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="210" y="250" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">OAuth</text>
    <rect x="300" y="224" width="120" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="360" y="250" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">MCP server</text>
    <path d="M120 250H158" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M260 250H298" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#arrow)" />
    <path d="M420 250H466" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow-teal)" />

    <!-- Shared application layer -->
    <rect x="470" y="30" width="250" height="280" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <text x="595" y="70" text-anchor="middle" dy="0.35em" fill="#134e4a" font-size="17" font-weight="700">Shared Laravel layer</text>
    <text x="595" y="94" text-anchor="middle" dy="0.35em" fill="#0f766e" font-size="13">shared business logic</text>
    <line x1="520" y1="116" x2="670" y2="116" stroke="#99f6e4" stroke-width="1.5" />
    <text x="595" y="150" text-anchor="middle" dy="0.35em" fill="#134e4a" font-size="16" font-weight="600">Actions</text>
    <text x="595" y="186" text-anchor="middle" dy="0.35em" fill="#134e4a" font-size="16" font-weight="600">Policies</text>
    <text x="595" y="222" text-anchor="middle" dy="0.35em" fill="#134e4a" font-size="16" font-weight="600">Validation</text>
    <text x="595" y="258" text-anchor="middle" dy="0.35em" fill="#134e4a" font-size="16" font-weight="600">Limits</text>

    <!-- Database -->
    <rect x="800" y="144" width="150" height="52" rx="10" fill="#ffffff" stroke="#292524" stroke-width="1.5" />
    <text x="875" y="170" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">PostgreSQL</text>
    <path d="M720 170H798" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow-teal)" />

    <!-- Realtime path -->
    <text x="0" y="350" fill="#78716c" font-size="13" font-weight="600">Realtime updates</text>
    <path d="M595 310V372" fill="none" stroke="#78716c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" />
    <rect x="545" y="374" width="100" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="595" y="400" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">Events</text>
    <path d="M545 400H517" fill="none" stroke="#78716c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" />
    <rect x="355" y="374" width="160" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="435" y="400" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">Reverb + Redis</text>
    <path d="M355 400H322" fill="none" stroke="#78716c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)" />
    <rect x="0" y="374" width="320" height="52" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />
    <text x="160" y="400" text-anchor="middle" dy="0.35em" fill="#292524" font-size="16" font-weight="600">Browser refreshes automatically</text>
</svg>
