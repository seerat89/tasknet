name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# New pushes cancel superseded runs on branches and pull requests, but never a run on main,
# which may be in the middle of a production migration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests, style and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tasknet_test
          POSTGRES_USER: tasknet_ci
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasknet_ci -d tasknet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values. The local suite uses in-memory SQLite (phpunit.xml); CI overrides it
    # with PostgreSQL through the environment, which PHPUnit does not replace.
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tasknet_test
      DB_USERNAME: tasknet_ci
      DB_PASSWORD: ci-test-only-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, pgsql, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the application
        run: |
          cp .env.example .env
          echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      # Built first because the tests render pages that load the Vite manifest.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # OAuth signing keys are git-ignored; some tests need them to exist, as they do after the first local start.
      - name: Generate OAuth keys
        run: php artisan passport:keys --no-interaction

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests on PostgreSQL
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit

      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build-tool findings do not ship to users, so they are reported without failing CI or raising an error annotation.
      - name: Audit all npm dependencies (informational)
        run: npm audit || true

  # Runs only for pushes to main, and only after the job above has passed. Vercel's production
  # Deployment Check requires this job, so a failed test or migration keeps the new build off the domain.
  migrate:
    name: Run production migrations
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Never run two production migrations at once, and never cancel one that has started.
    concurrency:
      group: production-migrations
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo_pgsql, pgsql, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Migrate the production database
        env:
          APP_ENV: production
          DB_CONNECTION: pgsql
          # Neon's unpooled connection string, stored as a repository secret. Never committed.
          DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "The PROD_DATABASE_URL repository secret is not set." >&2
            exit 1
          fi

          # Migrations need a direct session. Neon's pooled endpoint (PgBouncer, host contains "-pooler") breaks them.
          case "$DB_URL" in
            *-pooler*)
              echo "PROD_DATABASE_URL is Neon's pooled connection. Use the unpooled (direct) connection string." >&2
              exit 1
              ;;
          esac

          # Fail early with a readable message if the database is unreachable, and show what is already there.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA             -c "select 'Connected to PostgreSQL ' || current_setting('server_version') || ' as ' || current_user"             -c "select 'Existing tables in public: ' || count(*) from information_schema.tables where table_schema = 'public'"

          # The migration does not use the key; Laravel only needs one to boot.
          APP_KEY="$(php artisan key:generate --show)"
          export APP_KEY
          php artisan migrate --force --no-interaction
